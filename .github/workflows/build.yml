name: RepCity Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract application
        run: |
          ZIP=$(find . -maxdepth 1 -iname '*.zip' -type f | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP archive not found"
            exit 1
          fi

          mkdir -p extracted app
          unzip -q "$ZIP" -d extracted

          PROJECT_DIR=$(find extracted -name pubspec.yaml -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Flutter project not found in ZIP"
            exit 1
          fi

          cp -a "$PROJECT_DIR/." app/

      - name: Check UTF-8 and fix known Dart error
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          extensions = {".dart", ".yaml", ".yml", ".json", ".xml", ".kt", ".java"}
          for file in Path(".").rglob("*"):
              if file.is_file() and file.suffix.lower() in extensions:
                  file.read_bytes().decode("utf-8-sig")

          for file in Path("lib").rglob("*.dart"):
              content = file.read_text(encoding="utf-8-sig")
              content = content.replace("const Row(", "Row(")
              file.write_text(content, encoding="utf-8")

          print("UTF-8 check passed")
          PY

      - name: Prepare Android project
        working-directory: app
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name repcity --org com.repcity .
          fi

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: RepCity-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
